name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole point of the project is running the same on both, so both
        # are tested on every push.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install the project
        run: uv sync --python ${{ matrix.python }} --extra dev --extra metrics

      - name: Linter
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -q

  build-check:
    name: The package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build
        run: uv build

      - name: Install the wheel in a clean environment and try it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/hamrlog --version
          /tmp/clean/bin/hamrlog info
          # Translations and the equipment catalog are package data: check
          # the wheel really carries them.
          /tmp/clean/bin/python -c "
          from hamrlog import i18n
          from hamrlog.db.preseed import load_catalogs
          assert i18n.load_catalog('es'), 'no Spanish translations in the wheel'
          catalogs = load_catalogs()
          assert all(catalogs.values()), catalogs.keys()
          "

      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  # semantic-release reads the conventional commits since the last tag and,
  # when one of them calls for it (feat, fix, perf, breaking change), bumps
  # the version, commits it, tags vX.Y.Z and pushes. Nothing to release, no
  # tag. Only for pushes to main, and only once every test has passed.
  release:
    name: Versión nueva
    needs: [test, build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Release exactly the commit that was tested, even if main moved on
      # meanwhile (the push then fails and the next run releases).
      - name: Volver al commit probado
        run: git reset --hard ${{ github.sha }}

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Calcular la versión, etiquetarla y empujarla
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uvx --from python-semantic-release==10.7.0
          semantic-release version --no-vcs-release --no-changelog

  # A tag pushed with GITHUB_TOKEN triggers no workflow, so the build and the
  # GitHub release are called from here.
  publish:
    name: Publicar
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
